<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" role="img" aria-label="Logo Trivia Colombia">
  <defs>
    <linearGradient id="colombiaAmarillo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFBE00"/>
    </linearGradient>
    <linearGradient id="colombiaAzul" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003893"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="colombiaRojo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="100%" stop-color="#E52B50"/>
    </linearGradient>
    <filter id="sombraSuave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Escudo / Bandera Dinámica -->
  <g transform="translate(15, 15)" filter="url(#sombraSuave)">
    <rect x="0" y="0" width="85" height="42" rx="6" fill="url(#colombiaAmarillo)"/>
    <rect x="0" y="42" width="85" height="23" fill="url(#colombiaAzul)"/>
    <rect x="0" y="65" width="85" height="25" rx="6" fill="url(#colombiaRojo)"/>
    <!-- Brújula / Estrella de conocimiento en el centro -->
    <circle cx="42.5" cy="45" r="18" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="42.5,31 46,42 57,45 46,48 42.5,59 39,48 28,45 39,42" fill="#003893"/>
    <circle cx="42.5" cy="45" r="3" fill="#CE1126"/>
  </g>

  <!-- Texto Principal -->
  <g transform="translate(120, 30)">
    <text x="0" y="32" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="38" fill="#003893" letter-spacing="-0.5">
      TRIVIA
      <tspan fill="#CE1126">COLOMBIA</tspan>
    </text>
    <text x="2" y="58" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#555555" letter-spacing="3.5">
      JUEGO DE PREGUNTAS Y SABERES
    </text>
  </g>
</svg>
